name: Security Audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # Prod-only (#9): unfixable dev-only tooling advisories (the `braces`
        # chain via eslint-config-next) must not keep this gate red forever.
        # A weekly scheduled full `npm audit` (report-only) is a follow-up.
        run: npm audit --omit=dev --audit-level=high

      - name: Verify schema reconstruction is complete
        run: |
          # Case-insensitive (-i): the migrations are lowercase, so a
          # case-sensitive grep can never match (this was the old bug — #16).
          # DB-6: migration 049 must contain the core tables reconstructed from the live schema
          for table in exp_orders exp_products exp_product_variants exp_rate_limit_windows exp_artwork_uploads; do
            grep -qi "create table if not exists $table" supabase/migrations/049_Migration_1.sql || { echo "Missing table $table in migration 049"; exit 1; }
          done
          # DB-1: migration 059 applies the missing 057/058 design-persistence tables
          for table in exp_product_designs exp_product_design_assets exp_product_design_exports; do
            grep -qi "create table if not exists $table" supabase/migrations/059_batch2_security_remediation.sql || { echo "Missing table $table in migration 059"; exit 1; }
          done
          grep -qi "weight_lb" supabase/migrations/049_Migration_1.sql || { echo "Missing weight_lb column in migration 049"; exit 1; }
          grep -qi "drop policy if exists exp_promo_codes_public_read" supabase/migrations/059_batch2_security_remediation.sql || { echo "Missing promo public-read drop in migration 059"; exit 1; }
          grep -qi "drop policy if exists exp_bundle_deals_public_read" supabase/migrations/059_batch2_security_remediation.sql || { echo "Missing bundle public-read drop in migration 059"; exit 1; }
          grep -qi "design-artifacts" supabase/migrations/059_batch2_security_remediation.sql || { echo "Missing design-artifacts bucket in migration 059"; exit 1; }
          echo "Schema reconstruction verification passed"
